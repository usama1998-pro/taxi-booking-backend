networks:
  taxi-booking-network:
    external: true
    name: taxi-booking-network

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - taxi-booking-network
    environment:
      POSTGRES_USER: ${DATABASE_USER:-taxi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-taxi}
      POSTGRES_DB: ${DATABASE_NAME:-taxi_booking}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taxi-booking-network

volumes:
  postgres_data:
